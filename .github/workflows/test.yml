name: Test and CI Foundation

on:
  workflow_dispatch:

  push:
    branches:
      - dev
      - staging

  pull_request:
    branches:
      - main
      - staging
      - dev
      - 'refactor/**'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Check repository file sizes
        if: github.event_name == 'push' || github.base_ref == 'dev' || github.base_ref == 'staging' || github.base_ref == 'main'
        run: npm run check:filesize

      - name: Check incremental file sizes
        if: github.event_name == 'pull_request' && github.base_ref != 'dev' && github.base_ref != 'staging' && github.base_ref != 'main'
        run: npm run check:filesize:diff -- "${{ github.event.pull_request.base.sha }}"

      - name: Run tests
        run: npm test
